name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: pip install buildozer cython==0.29.36

      - name: Prepare Android SDK
        run: |
          buildozer android debug || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$HOME/.buildozer" -type f -name sdkmanager 2>/dev/null
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-33" "build-tools;34.0.0"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
